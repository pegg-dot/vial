name: VIAL verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vialgrade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run audit:security
      - run: npm run db:backup-drill
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run audit:roles
      - run: npm run audit:accessibility
      - run: npm run verify:live:selftest
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vialgrade
          POSTGRES_USER: vialgrade
          POSTGRES_PASSWORD: vialgrade_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vialgrade -d vialgrade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate production environment
        run: npm run env:check
        env:
          DATABASE_URL: postgres://vialgrade:vialgrade_ci@127.0.0.1:5432/vialgrade
          NEXT_PUBLIC_SITE_URL: https://vialgrade.example
          VIALGRADE_SESSION_SECRET: ci-session-secret-at-least-32-characters
          VIALGRADE_PRIVACY_HASH_SECRET: ci-privacy-secret-at-least-32-characters
      - name: Build against PostgreSQL contract
        run: npm run build
        env:
          DATABASE_URL: postgres://vialgrade:vialgrade_ci@127.0.0.1:5432/vialgrade
          NEXT_PUBLIC_SITE_URL: https://vialgrade.example
          VIALGRADE_SESSION_SECRET: ci-session-secret-at-least-32-characters
          VIALGRADE_PRIVACY_HASH_SECRET: ci-privacy-secret-at-least-32-characters
          VIALGRADE_SEED_FIXTURES: "true"
          VIALGRADE_SEED_DEMO_ACCOUNTS: "true"

  # Production has exactly one deployment authority at a time.
  #
  # Today that authority is Vercel's Git integration. Vercel runs scripts/build.mjs before a
  # deployment can become READY, so the environment contract, TypeScript check and unit suite are
  # still release gates even though this job is disabled.
  #
  # This CLI promotion path is deliberately opt-in. A stale VERCEL_TOKEN previously made the whole
  # workflow red after both verification jobs had passed, even though Vercel's Git integration had
  # already deployed the same SHA successfully. Presence of a secret is not proof that this job is
  # meant to own production.
  #
  # To migrate production authority to CI:
  #   1. install a fresh VERCEL_TOKEN
  #   2. set repository variable VERCEL_CI_DEPLOY_ENABLED=true
  #   3. prove this job can promote a green main commit
  #   4. only then disable Vercel Git auto-deploy
  deploy:
    needs: [verify, postgres-contract]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VERCEL_CI_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: team_MA7HI0IC6XvMpuw33G9utThB
      VERCEL_PROJECT_ID: prj_IsRs7YJEMkuBWGR7qCRbNrceqCCC
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Vercel CLI
        run: npm i -g vercel@59.11.7
      - name: Validate Vercel credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error title=Missing Vercel credential::VERCEL_TOKEN is required when VERCEL_CI_DEPLOY_ENABLED=true"
            exit 1
          fi
          vercel whoami --token="$VERCEL_TOKEN" >/dev/null
      - name: Promote to production
        id: promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $GITHUB_SHA -> $url"
          echo "### Promoted ${GITHUB_SHA:0:7} to production" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Prove the site serves
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://vialgrade.com/ || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "::error title=Deployed but not serving::vialgrade.com did not return 200 after promotion"
          exit 1
