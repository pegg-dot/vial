name: VIAL verification
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run audit:security
      - run: npm run db:backup-drill
      - run: npm audit --audit-level=high
      - run: npm run build
      # Was continue-on-error while its seller/lab token harness had drifted from the app. The
      # harness has been reconciled and the audit now passes here (run 1d5594a: "HTTP role audit
      # passed for anonymous, customer and staff page boundaries"), so it BLOCKS again. It is the
      # only check that walks all 48 routes as each role and asserts the boundaries hold; leaving
      # it advisory meant an unprotected /admin route could go green.
      - run: npm run audit:roles
      - run: npm run audit:accessibility
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vialgrade
          POSTGRES_USER: vialgrade
          POSTGRES_PASSWORD: vialgrade_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vialgrade -d vialgrade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate production environment
        run: npm run env:check
        env:
          DATABASE_URL: postgres://vialgrade:vialgrade_ci@127.0.0.1:5432/vialgrade
          NEXT_PUBLIC_SITE_URL: https://vialgrade.example
          VIALGRADE_SESSION_SECRET: ci-session-secret-at-least-32-characters
          VIALGRADE_PRIVACY_HASH_SECRET: ci-privacy-secret-at-least-32-characters
      - name: Build against PostgreSQL contract
        run: npm run build
        env:
          DATABASE_URL: postgres://vialgrade:vialgrade_ci@127.0.0.1:5432/vialgrade
          NEXT_PUBLIC_SITE_URL: https://vialgrade.example
          VIALGRADE_SESSION_SECRET: ci-session-secret-at-least-32-characters
          VIALGRADE_PRIVACY_HASH_SECRET: ci-privacy-secret-at-least-32-characters
          VIALGRADE_SEED_FIXTURES: "true"
          VIALGRADE_SEED_DEMO_ACCOUNTS: "true"

  # Deploy AFTER the checks, not four seconds after the push.
  #
  # Vercel's Git integration builds whatever lands on main the moment it lands. On 2026-08-24 the
  # commit was authored at 18:34:58 and the production deployment was created at 18:35:02 — while
  # CI still had five minutes left to run. Between 20 and 24 August the verify workflow failed
  # eight times in a row on main and every one of those commits shipped to vialgrade.com anyway.
  #
  # A GitHub ruleset cannot close this: rulesets govern MERGES, and this repo is worked by pushing
  # straight to main. The only thing that makes green a real precondition is making CI the deploy
  # path, so a red run has nothing to promote.
  #
  # This job stays inert until VERCEL_TOKEN exists, and says so loudly in the run summary rather
  # than skipping in silence. The paired change — turning Vercel's own auto-deploy off in
  # vercel.json — must land WITH that secret, never before it, or nothing ships at all.
  deploy:
    needs: [verify, postgres-contract]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      # Identifiers, not credentials — both are already public in every deployment URL.
      VERCEL_ORG_ID: team_MA7HI0IC6XvMpuw33G9utThB
      VERCEL_PROJECT_ID: prj_IsRs7YJEMkuBWGR7qCRbNrceqCCC
    steps:
      - name: Is the deploy gate wired?
        id: gate
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "wired=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy gate is NOT wired::VERCEL_TOKEN is not set, so this green run did not deploy anything. Vercel is still auto-deploying every push to main without waiting for these checks. Add the secret to close the gate."
            {
              echo "### Deploy gate is not wired"
              echo ""
              echo "This run passed, but it did **not** deploy. Vercel is still building every push to"
              echo "\`main\` on its own, before these checks finish."
              echo ""
              echo "To close it: \`gh secret set VERCEL_TOKEN\` with a token from"
              echo "<https://vercel.com/account/settings/tokens>, then turn Vercel's auto-deploy off."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "wired=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.wired == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.wired == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install Vercel CLI
        if: steps.gate.outputs.wired == 'true'
        run: npm i -g vercel@latest
      - name: Pull production environment
        if: steps.gate.outputs.wired == 'true'
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build
        if: steps.gate.outputs.wired == 'true'
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Promote to production
        if: steps.gate.outputs.wired == 'true'
        id: promote
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $GITHUB_SHA -> $url"
          echo "### Promoted ${GITHUB_SHA:0:7} to production" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
      # The deployment is only real if the site actually serves. A promote that returns a URL
      # nobody checked is the same class of claim as a guard that never fails.
      - name: Prove the site serves
        if: steps.gate.outputs.wired == 'true'
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://vialgrade.com/ || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "::error title=Deployed but not serving::vialgrade.com did not return 200 after promotion"
          exit 1
