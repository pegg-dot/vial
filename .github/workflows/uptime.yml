# Notices that vialgrade.com is down, and emails the owner, without any new account.
#
# On 14 August 2026 the site returned a server error on every page for hours and nobody knew until
# someone happened to load it. Alerting from inside the app cannot catch that case: if the
# deployment itself is broken, the code that would send the alert never runs. The check has to come
# from outside, which is what this is.
#
# GitHub is used because the owner already has it. When a scheduled workflow fails, GitHub emails
# the repository owner by default — no webhook, no third-party monitoring service, no signup.
#
# ⚠️ COST, stated plainly: this repository is PRIVATE, so Actions minutes are metered and billed in
# whole minutes per run. Every 30 minutes is ~1,440 minutes/month against a 2,000-minute free
# allowance, which leaves room for CI but not much. A dedicated uptime service (UptimeRobot's free
# tier checks every 5 minutes) is both cheaper and more frequent, and is the better long-term answer.
# This exists so there is SOMETHING watching today rather than nothing.
name: Uptime

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: # so it can be run by hand from the Actions tab to test it

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Is vialgrade.com serving and is its database reachable?
        run: |
          set -uo pipefail
          URL="https://vialgrade.com/api/health/ready"

          # Checked instead of the homepage on purpose: since the outage the homepage deliberately
          # returns a friendly 200 with a "live data unavailable" notice, so a homepage check would
          # report healthy during precisely the incident worth hearing about. This endpoint reports
          # ready ONLY when the database actually answers.
          #
          # Retried before failing, because one blip is not an outage and an alert that cries wolf
          # gets muted — which is the same as having no alert at all.
          for attempt in 1 2 3; do
            body=$(curl -sS --max-time 25 -w $'\n%{http_code}' "$URL" || echo $'\n000')
            code=$(printf '%s' "$body" | tail -n1)
            payload=$(printf '%s' "$body" | sed '$d')

            if [ "$code" = "200" ]; then
              echo "OK (attempt $attempt): $payload"
              exit 0
            fi

            echo "Attempt $attempt failed — HTTP $code"
            echo "$payload"
            [ "$attempt" -lt 3 ] && sleep 20
          done

          echo
          echo "::error title=vialgrade.com is not healthy::Three consecutive checks failed. Last status: HTTP $code"
          echo "The site is either down or its database is unreachable."
          echo "Check https://vercel.com/nates-projects-16a790ce/vial and the Neon resource."
          exit 1
